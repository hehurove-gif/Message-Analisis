# Configuración central del analizador de conversaciones.
# Ningún umbral debe estar fijo en el código: todo se lee de aquí.

privacy:
  anonymize_participants: true   # nombres reales -> "A" / "B"
  persist_raw_chat: false        # nunca escribir el chat completo a disco
  allow_network: false           # el procesamiento es 100% local

segmentation:
  # RÁFAGA: mensajes consecutivos del mismo autor separados por un
  # intervalo máximo. Sirve para estudiar hábitos de escritura y
  # fragmentación. Valor inicial EXPERIMENTAL, no una frontera de turno.
  burst_max_gap_seconds: 300
  # TURNO: mensajes consecutivos del mismo autor hasta que interviene el
  # otro, dentro de una misma sesión. No depende de burst_max_gap_seconds;
  # un turno puede contener varias ráfagas.
  # SESIÓN: criterio operativo para segmentar periodos de interacción.
  # NO se asume que represente una separación real de conversaciones.
  # Valor inicial PROVISIONAL; se prueba con análisis de sensibilidad.
  session_gap_hours: 6
  sensitivity_session_gap_hours: [2, 6, 12]
  # Reglas de borde: una ráfaga continúa si el intervalo es <= burst_max_gap_seconds;
  # una sesión continúa si el intervalo es <= session_gap_hours (se corta solo
  # cuando lo SUPERA).
  # REGISTRO POR TURNO (duración transcurrida != actividad efectiva): para cada
  # turno se guardan primer y último timestamp, tiempo transcurrido, número de
  # mensajes, número de ráfagas, los intervalos de silencio entre mensajes
  # consecutivos y el tiempo dentro de ráfagas. Un turno de 5 h transcurridas
  # NO significa 5 h de conversación.
  # SENSIBILIDAD de reanudaciones/últimos mensajes: la dirección es estable si el mismo participante lidera con
  # todos los huecos. Para llamarla "robusto" además la diferencia relativa |A-B|/(A+B) debe ser >= este valor en
  # TODOS los huecos; si la dirección se mantiene pero algún margen es menor, "robusto_en_direccion_magnitud_sensible".
  # Valor EXPERIMENTAL y configurable; no es un umbral estadístico.
  min_margin_for_robust: 0.10
  turn_record_fields: [first_ts, last_ts, elapsed_minutes, n_messages, n_bursts, silence_intervals_minutes, minutes_within_bursts]

latency:
  # MÉTRICA: "latencia hasta la siguiente intervención del interlocutor".
  # Para cada turno cuyo siguiente mensaje (en orden cronológico) es del
  # otro participante: tiempo entre el último mensaje del turno y ese
  # mensaje. NO tiene límite máximo ni depende de la sesión: una
  # intervención 8 h 30 min después cuenta como tal.
  # Que alguien sea el siguiente en escribir NO demuestra que responda al
  # mensaje anterior (eso es la "respuesta semántica", que se evalúa aparte).
  primary_statistic: median      # la mediana es la métrica principal
  percentiles: [75, 90]
  # RESOLUCIÓN: la exportación trae minutos, no segundos; una latencia 0 = "en el mismo minuto".
  # DISTRIBUCIÓN: proporción ACUMULADA de latencias <= cada corte (minutos). Cortes descriptivos,
  # EXPERIMENTALES; no son umbrales de "rápido" o "lento".
  buckets_minutes: [0, 1, 5, 15, 60]
  # PAUSA LARGA: latencia mayor a N días = el chat estuvo parado; se reporta aparte. Experimental.
  long_pause_days: 30
  # Se reportan SIEMPRE las tres medianas y la proporción por sesión:
  #   general, dentro de la misma sesión, entre sesiones.
  # "Dentro de la misma sesión" = latencia <= segmentation.session_gap_hours.
  report_general: true
  report_within_session: true
  report_between_sessions: true
  report_proportion_within_vs_between: true
  # ESTADOS de un turno (mutuamente excluyentes):
  #  - con_intervencion: el siguiente mensaje es del otro; tiene latencia.
  #  - sin_intervencion_previa_a_su_nuevo_turno: el siguiente mensaje es del
  #    mismo autor, ya en otra sesión. NO tiene latencia, NO entra en las
  #    medianas y NO demuestra indiferencia ni rechazo. Es independiente de
  #    "sin_respuesta_observada" y su clasificación DEPENDE del hueco de
  #    sesión (cambia al usar 2, 6 o 12 h), por lo que se reporta en cada uno.
  #  - sin_respuesta_observada: no hay ningún mensaje posterior (último
  #    turno del chat). Límite de los datos, no evidencia de indiferencia.

turn_content:
  # CONTENIDO DE TURNOS (provisional). Turno "minimo" = sin palabras sustantivas ni pregunta; "desarrollado" =
  # >= developed_min_words palabras sustantivas sumando sus mensajes; el resto, "breve". Experimental.
  developed_min_words: 15
  sensitivity_developed_min_words: [10, 15, 25]
  # Acuses breves que NO cuentan como palabra sustantiva (comparación en minúsculas, sin puntuación).
  # Entre comillas: sin ellas YAML lee no/yes como booleanos.
  acknowledgements: ["ok", "oki", "okey", "okay", "okk", "okis", "va", "vale", "sale", "sí", "si", "no", "ya", "aja", "ajá", "claro", "bueno", "bien", "ah", "oh", "eh", "mmm", "mm", "k", "sip", "nop", "simon", "simón", "neta", "yes", "yep", "nope", "cool", "gracias", "grax", "perfecto", "listo"]

habits:
  # HÁBITOS TEMPORALES (provisional): mensajes por hora local, día y franja. Franjas [inicio, fin) en horas,
  # EXPERIMENTALES. Hora local del teléfono que exportó (sin corrección de zona horaria).
  # DÍA LÓGICO: empieza a esta hora (mensajes de 00:00–04:59 cuentan en el día anterior). 0 = día calendario.
  day_start_hour: 5
  day_parts: {madrugada: [0, 6], manana: [6, 12], tarde: [12, 19], noche: [19, 24]}

style:
  # ESTILO (provisional). Pregunta = "?"/"¿" o empieza con una de estas palabras (definiciones §4).
  interrogatives: [qué, cómo, cuándo, dónde, adónde, por qué, cuál, cuáles, quién, quiénes, cuánto, cuánta, cuántos, cuántas, what, how, when, where, why, who, which]
  # Mensaje "en mayúsculas": al menos N letras y todas mayúsculas.
  min_letters_uppercase: 4

temporal:
  period_granularities: [week, month]
  # Un cambio sostenido exige que la mediana móvil se desvíe más de
  # `deviation_ratio` respecto a la línea base durante N periodos seguidos.
  rolling_window_periods: 4
  sustained_change_min_periods: 3
  deviation_ratio: 0.5

data_sufficiency:
  # Debajo de estos mínimos, la dimensión se marca "insuficiente" (suficiencia
  # de datos) y el resultado es "no concluyente". Valores experimentales.
  min_messages_for_any_metric: 30
  min_turns_for_response_time: 20
  min_sessions_for_initiative: 10
  min_events_per_period_for_trend: 5

romantic_interest:
  # Un indicador candidato NO equivale a interés romántico. Un cumplido puede
  # ser amistoso, romántico, sarcástico o parte del estilo habitual de la
  # persona. Se exige recurrencia, contexto y análisis de la respuesta.
  # Un evento aislado se registra pero no pesa.
  # EVENTO = un mensaje con al menos una coincidencia (una unidad por mensaje).
  event_unit: message
  # PERIODO = semana ISO (lunes a domingo); el mes es una alternativa de sensibilidad.
  period_unit: week
  # VALORES EXPERIMENTALES y configurables. Tres eventos en dos semanas NO
  # constituyen una validación científica de interés romántico: solo deciden
  # si el sistema reporta una recurrencia descriptiva. Se prueban con la
  # rejilla de `robustness`.
  min_events_for_pattern: 3
  min_distinct_periods: 2
  # LÍNEA BASE de comunicación: un saludo convencional ("buenos días",
  # "buenas noches") y los emojis no afectivos por sí solos no son candidatos.
  # Un saludo cuenta solo si añade un elemento afectivo (apodo, emoji
  # afectivo, deseo que excede la convención); esos casos se marcan "límite".
  greeting_alone_is_candidate: false
  non_affective_emojis_alone: ["😊", "☀️"]
  # CATEGORÍAS DE RESPUESTA (una principal y, como máximo, una secundaria).
  # Describen lo que se comunica, no sentimientos. Una respuesta ambigua no
  # se clasifica como rechazo.
  response_categories:
    - respuesta_directa
    - reconocimiento_sin_correspondencia_afectiva
    - correspondencia_afectiva
    - reciprocidad_amistosa_ambigua
    - invitacion_aceptada
    - invitacion_declinada
    - invitacion_pospuesta_o_no_comprometida
    - cambio_de_tema
    - respuesta_no_relacionada
    - limite_interpersonal_suave
    - limite_interpersonal_explicito
    - sin_respuesta_semantica_observable
  # Un límite se registra con su ALCANCE (apodos, trato, relación romántica,
  # contacto) y no se extiende automáticamente a otros aspectos.
  # La respuesta a un indicador es la siguiente intervención del otro
  # participante, sin ventana máxima (ver `latency`). Su demora se reporta
  # como dato propio. Si esa intervención trata o no del indicador
  # (respuesta semántica) se evalúa por separado en la Fase 6.
  # Línea base individual: un indicador se compara con la frecuencia
  # habitual de esa misma persona dentro del chat y con su estilo general
  # (p. ej. quien usa apodos o cumplidos de forma constante en todo tipo
  # de temas). Solo hay datos de este chat; no se infiere cómo habla con
  # otras personas.
  require_individual_baseline: true
  # Si la evidencia no alcanza, el resultado es "no concluyente".
  allow_inconclusive: true

participation:
  # BALANCE DE PARTICIPACIÓN: distribución de turnos, mensajes y palabras.
  # Palabras = fragmentos separados por espacios en mensajes de texto.
  # Cada unidad se reporta POR SEPARADO; no hay etiqueta única de "equilibrio"
  # ni indicador compuesto todavía.
  # No es reciprocidad: tener turnos equilibrados no demuestra amistad recíproca.
  report_units_separately: true
  composite_balance_index: false
  words_definition: whitespace_tokens_in_text_messages

reciprocity:
  # RECIPROCIDAD: correspondencia en la interacción (respuestas, seguimiento
  # de temas, preguntas, iniciativas y apoyo). TODAVÍA SIN definición
  # operativa ni métricas propias: ningún reporte la afirma como patrón.
  defined: false

evidence_assessment:
  # Tres ejes independientes en cada hallazgo. Ninguna etiqueta es una
  # probabilidad ni está calibrada estadísticamente: son heurísticas
  # experimentales y configurables.
  epistemic_labels: [observación, patrón, hipótesis]
  data_sufficiency_labels: [suficiente, insuficiente, no_evaluada]   # ver `data_sufficiency`
  # La robustez se declara POR FAMILIA y nunca como "robusto" a secas:
  # "robusto ante <familia>" solo describe lo efectivamente probado.
  robustness_families: [recurrencia, segmentacion, indicadores]
  robustness_labels: [robusto_ante_familia, robusto_en_direccion_magnitud_sensible, sensible_a_familia, no_probada]
  # Una configuración que la ventana de datos no permite probar es
  # "no_evaluable": no cuenta como cumplida ni como validación satisfactoria.
  robustness_untestable_label: no_evaluable
  # Robustez ante parámetros NO equivale a validez científica.
  robustness_is_not_validity: true

robustness:
  # Las familias se prueban por separado y NO se cruzan entre sí.
  recurrence:
    min_events: [2, 3, 4, 5]
    min_distinct_periods: [1, 2, 3]
    period_units: [week, month]
  segmentation:
    session_gap_hours: [2, 6, 12]
    burst_max_gap_seconds: [120, 300, 600]   # solo afecta a ráfagas, no a latencias ni a estados
  indicators:
    # Variantes de inclusión de candidatos (sobre `clase_evento` y `ambiguo`).
    variants:
      P: "clase_evento = indicador_candidato"                      # principal
      S1: "P + clase_evento = calidez_no_especifica"
      S2: "P excluyendo ambiguo = si"

event_classes:
  # Clases de evento y su tratamiento en el conteo principal.
  linea_base: {main_count: false}
  calidez_no_especifica: {main_count: false, evidence_contextual: true, in_variant: S1}
  indicador_candidato: {main_count: true}
  declaracion_explicita: {main_count: false, reported_apart: true}
  no_candidato: {main_count: false}

specificity:
  # FRECUENCIA y ESPECIFICIDAD son dimensiones separadas. La especificidad es
  # una anotación cualitativa provisional (baja/media/alta), NO una puntuación
  # científica: no pondera la frecuencia, no forma ningún índice romántico y
  # no altera métricas sin justificación explícita. Está pendiente investigar
  # qué rasgos distinguen el afecto general de una señal específicamente
  # romántica y qué tan fiable es esa distinción.
  provisional_labels: [baja, media, alta]
  weights_metrics: false
  composite_index: false

parsing:
  expected_participants: 2
  # ORDEN DE FECHA: sin valor por defecto. Con null, un archivo cuyas fechas no permiten distinguir
  # día/mes de mes/día se BLOQUEA (contrato v0.2). Solo "dmy" o "mdy" lo resuelven, y deben darlo
  # el usuario o la prueba (p. ej. data/synthetic/00_escenarios_validacion.txt con "dmy").
  date_order_hint: null
  two_digit_year_century: 2000
  # Una línea que no es un encabezado válido pero empieza con una fecha y trae una hora en sus
  # primeros N caracteres tiene "aspecto de timestamp": se reporta, nunca se anexa. Heurística experimental.
  timestamp_like_window_chars: 40
  # Caracteres IGNORADOS al inicio de una línea, solo para reconocer el encabezado (la línea original
  # no se altera y NO se eliminan del contenido de los mensajes: U+200E/U+200F pueden ser significativos
  # en idiomas de derecha a izquierda). U+FEFF inicial del archivo se descarta al decodificar.
  ignored_leading_chars: ["\u200e", "\u200f", "\ufeff"]
  # Caracteres que se tratan como un ESPACIO ORDINARIO solo al reconocer el timestamp. El
  # `timestamp_original` conserva el carácter original.
  space_like_chars: ["\u202f"]
  # Los formatos, marcadores de multimedia/eliminado y avisos del sistema son tablas en parsers/
  # (formats.py, patterns.py). Todos son SIMULADOS o documentados por terceros; ninguno está observado
  # en una exportación real (ver docs/formatos_exportacion_whatsapp.md y docs/limitaciones_y_formatos_pendientes.md).
  # No hay umbral de líneas no procesadas: cualquiera deja el archivo pendiente de revisión de calidad
  # y el análisis deshabilitado hasta resolverlas o aceptar expresamente cada pérdida.
